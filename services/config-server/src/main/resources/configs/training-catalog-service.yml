spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/training_catalog
    username: postgres
    password: postgres
  
  jpa:
    hibernate:
      ddl-auto: validate
  
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/training-realm

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    export:
      prometheus:
        enabled: true
  otlp:
    tracing:
      endpoint: http://otel-collector:4317
    metrics:
      export:
        endpoint: http://otel-collector:4317
  tracing:
    sampling:
      probability: 1.0
