spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/training_notification
    username: postgres
    password: postgres
  
  jpa:
    hibernate:
      ddl-auto: update
  
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/training-realm

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    export:
      prometheus:
        enabled: true
