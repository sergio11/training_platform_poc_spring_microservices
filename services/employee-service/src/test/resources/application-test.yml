spring:
  datasource:
    url: jdbc:tc:postgresql:16-alpine:///test_employee
    username: test
    password: test
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration/employee
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:18080/realms/test-realm
  rabbitmq:
    host: localhost
    port: 5672

server:
  port: 0

management:
  endpoints:
    web:
      exposure:
        include: health
