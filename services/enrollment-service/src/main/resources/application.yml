spring:
  application:
    name: enrollment-service
  
  datasource:
    url: jdbc:postgresql://localhost:5432/training_enrollment
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    packages-to-scan: com.poc.training.enrollment.model, com.poc.training.shared.model
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  flyway:
    enabled: true
    locations: classpath:db/migration
  
  rabbitmq:
    host: localhost
    port: 5672
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
  
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/training-realm

server:
  port: 8082

outbox:
  polling-interval: ${OUTBOX_POLLING_INTERVAL:5000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

resilience4j:
  circuitbreaker:
    instances:
      catalogService:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10000
        permittedNumberOfCallsInHalfOpenState: 3
      employeeService:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10000
        permittedNumberOfCallsInHalfOpenState: 3
  retry:
    instances:
      catalogService:
        maxAttempts: 3
        waitDuration: 500
      employeeService:
        maxAttempts: 3
        waitDuration: 500

client:
  catalog:
    url: ${CATALOG_SERVICE_URL:http://localhost:8081}
    connect-timeout: ${CATALOG_CONNECT_TIMEOUT:3000}
    read-timeout: ${CATALOG_READ_TIMEOUT:5000}
  employee:
    url: ${EMPLOYEE_SERVICE_URL:http://localhost:8085}
