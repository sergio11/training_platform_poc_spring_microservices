spring:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration/enrollment
  
  rabbitmq:
    host: localhost
    port: 5672
    listener:
      simple:
        default-requeue-rejected: false
  
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/training-realm

server:
  port: 8082

management:
  tracing:
    export:
      otlp:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
