global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/prometheus-rules.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'training-catalog-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['training-catalog-service:8081']

  - job_name: 'enrollment-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['training-enrollment-service:8082']

  - job_name: 'certification-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['training-certification-service:8083']

  - job_name: 'notification-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['training-notification-service:8084']

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8888']
