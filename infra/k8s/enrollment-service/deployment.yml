apiVersion: apps/v1
kind: Deployment
metadata:
  name: training-enrollment-service
  namespace: training-platform
  labels:
    app: training-enrollment-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: training-enrollment-service
  template:
    metadata:
      labels:
        app: training-enrollment-service
    spec:
      containers:
        - name: training-enrollment-service
          image: training-enrollment-service:1.0.0
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: training-enrollment-config
            - secretRef:
                name: training-enrollment-secret
          env:
            - name: OTEL_TRACES_ENDPOINT
              value: "http://otel-collector:4318/v1/traces"
            - name: OTEL_LOGS_ENDPOINT
              value: "http://otel-collector:4318/v1/logs"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 90
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 10
