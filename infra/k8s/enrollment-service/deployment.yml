apiVersion: apps/v1
kind: Deployment
metadata:
  name: training-enrollment-service
  namespace: training-platform
  labels:
    app: training-enrollment-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: training-enrollment-service
  template:
    metadata:
      labels:
        app: training-enrollment-service
    spec:
      containers:
        - name: training-enrollment-service
          image: training-enrollment-service:latest
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: training-enrollment-config
            - secretRef:
                name: training-enrollment-secret
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 20
            periodSeconds: 5
