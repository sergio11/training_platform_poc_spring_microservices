  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: training-catalog-service
        - podSelector:
            matchLabels:
              app: training-enrollment-service
        - podSelector:
            matchLabels:
              app: training-certification-service
        - podSelector:
            matchLabels:
              app: training-notification-service
        - podSelector:
            matchLabels:
              app: training-employee-service
      ports:
        - protocol: TCP
          port: 5672
        - protocol: TCP
          port: 15672
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-services-to-keycloak
  namespace: training-platform
spec:
  podSelector:
    matchLabels:
      app: training-keycloak
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: training-catalog-service
        - podSelector:
            matchLabels:
              app: training-enrollment-service
        - podSelector:
            matchLabels:
              app: training-certification-service
        - podSelector:
            matchLabels:
              app: training-notification-service
        - podSelector:
