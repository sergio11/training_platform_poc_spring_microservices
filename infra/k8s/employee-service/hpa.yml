apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: training-employee-service-hpa
  namespace: training-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: training-employee-service
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
