apiVersion: apps/v1
kind: Deployment
metadata:
  name: training-keycloak
  namespace: training-platform
  labels:
    app: training-keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: training-keycloak
  template:
    metadata:
      labels:
        app: training-keycloak
    spec:
      containers:
        - name: training-keycloak
          image: quay.io/keycloak/keycloak:26.0
          args:
            - start
            - --import-realm
          env:
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_METRICS_ENABLED
              value: "true"
          ports:
            - containerPort: 8080
            - containerPort: 9000
          volumeMounts:
            - name: realm-import
              mountPath: /opt/keycloak/data/import/realm-export.json
              subPath: realm-export.json
          envFrom:
            - configMapRef:
                name: training-keycloak-config
            - secretRef:
                name: training-keycloak-secret
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1536Mi"
              cpu: "1000m"
          startupProbe:
            httpGet:
              path: /health/ready
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 60
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 9000
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 5
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 5
            timeoutSeconds: 10
      volumes:
        - name: realm-import
          configMap:
            name: training-keycloak-realm
            items:
              - key: realm-export.json
                path: realm-export.json
