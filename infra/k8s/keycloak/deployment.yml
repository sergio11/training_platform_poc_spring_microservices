apiVersion: apps/v1
kind: Deployment
metadata:
  name: training-keycloak
  namespace: training-platform
  labels:
    app: training-keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: training-keycloak
  template:
    metadata:
      labels:
        app: training-keycloak
    spec:
      containers:
        - name: training-keycloak
          image: quay.io/keycloak/keycloak:26.0
          args:
            - start
            - --import-realm
          env:
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_METRICS_ENABLED
              value: "true"
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: training-keycloak-config
            - secretRef:
                name: training-keycloak-secret
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          startupProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 5
