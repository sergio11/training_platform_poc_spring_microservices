apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: training-postgresql
  namespace: training-platform
  labels:
    app: training-postgresql
spec:
  serviceName: training-postgresql
  replicas: 1
  selector:
    matchLabels:
      app: training-postgresql
  template:
    metadata:
      labels:
        app: training-postgresql
    spec:
      containers:
        - name: training-postgresql
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - configMapRef:
                name: training-postgresql-config
            - secretRef:
                name: training-postgresql-secret
          volumeMounts:
            - name: postgresql-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
            initialDelaySeconds: 10
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: postgresql-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
