apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: training-notification-service-hpa
  namespace: training-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: training-notification-service
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  # JVM startup burns CPU for ~2 minutes; without a stabilization window the
  # autoscaler adds replicas that cannot fit on the single-node kind cluster.
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 900
    scaleDown:
      stabilizationWindowSeconds: 300
