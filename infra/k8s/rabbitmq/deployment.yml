apiVersion: apps/v1
kind: Deployment
metadata:
  name: training-rabbitmq
  namespace: training-platform
  labels:
    app: training-rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: training-rabbitmq
  template:
    metadata:
      labels:
        app: training-rabbitmq
    spec:
      containers:
        - name: training-rabbitmq
          image: rabbitmq:3.13-management-alpine
          ports:
            - containerPort: 5672
            - containerPort: 15672
          envFrom:
            - configMapRef:
                name: training-rabbitmq-config
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            exec:
              command:
                - rabbitmq-diagnostics
                - check_port_connectivity
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - rabbitmq-diagnostics
                - check_port_connectivity
            initialDelaySeconds: 10
            periodSeconds: 5
