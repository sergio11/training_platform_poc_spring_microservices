apiVersion: batch/v1
kind: Job
metadata:
  name: training-kong-migration
  namespace: training-platform
spec:
  template:
    spec:
      containers:
        - name: training-kong-migration
          image: kong:3.6
          command:
            - kong
            - migrations
            - bootstrap
          env:
            - name: KONG_DATABASE
              value: "off"
      restartPolicy: Never
  backoffLimit: 3
