apiVersion: v1
kind: Service
metadata:
  name: kong-proxy
  namespace: training-platform
  labels:
    app: training-kong
spec:
  selector:
    app: training-kong
  ports:
    - name: proxy
      protocol: TCP
      port: 8000
      targetPort: 8000
    - name: admin
      protocol: TCP
      port: 8001
      targetPort: 8001
  type: NodePort
