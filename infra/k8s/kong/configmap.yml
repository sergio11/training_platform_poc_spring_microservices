apiVersion: v1
kind: ConfigMap
metadata:
  name: training-kong-config
  namespace: training-platform
data:
  kong.yml: |
    _format_version: "3.0"
    services:
      - name: training-catalog-service
        url: http://training-catalog-service:8081
        routes:
          - name: catalog-routes
            paths:
              - /api/v1/courses
            strip_path: false
            methods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
        plugins:
          - name: jwt
            config:
              uri_param_names: []
              header_names:
                - Authorization
              claims_to_verify:
                - exp
              key_claim_name: iss
          - name: rate-limiting
            config:
              minute: 100
              policy: local
      - name: training-enrollment-service
        url: http://training-enrollment-service:8082
        routes:
          - name: enrollment-routes
            paths:
              - /api/v1/enrollments
            strip_path: false
            methods:
              - GET
              - POST
              - PATCH
        plugins:
          - name: jwt
            config:
              uri_param_names: []
              header_names:
                - Authorization
              claims_to_verify:
                - exp
              key_claim_name: iss
          - name: rate-limiting
            config:
              minute: 100
              policy: local
      - name: training-certification-service
        url: http://training-certification-service:8083
        routes:
          - name: certification-routes
            paths:
              - /api/v1/certificates
            strip_path: false
            methods:
              - GET
        plugins:
          - name: jwt
            config:
              uri_param_names: []
              header_names:
                - Authorization
              claims_to_verify:
                - exp
              key_claim_name: iss
          - name: rate-limiting
            config:
              minute: 100
              policy: local
      - name: training-notification-service
        url: http://training-notification-service:8084
        routes:
          - name: notification-routes
            paths:
              - /api/v1/notifications
            strip_path: false
            methods:
              - GET
        plugins:
          - name: jwt
            config:
              uri_param_names: []
              header_names:
                - Authorization
              claims_to_verify:
                - exp
              key_claim_name: iss
          - name: rate-limiting
            config:
              minute: 100
              policy: local
      - name: training-employee-service
        url: http://training-employee-service:8085
        routes:
          - name: employee-routes
            paths:
              - /api/v1/employees
            strip_path: false
            methods:
              - GET
              - POST
              - PUT
              - DELETE
        plugins:
          - name: jwt
            config:
              uri_param_names: []
              header_names:
                - Authorization
              claims_to_verify:
                - exp
              key_claim_name: iss
          - name: rate-limiting
            config:
              minute: 100
              policy: local
    consumers:
      - username: training-catalog-client
      - username: training-enrollment-client
      - username: training-certification-client
      - username: training-notification-client
      - username: training-employee-client
