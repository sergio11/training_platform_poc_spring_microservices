apiVersion: apps/v1
kind: Deployment
metadata:
  name: training-kong
  namespace: training-platform
  labels:
    app: training-kong
spec:
  replicas: 1
  selector:
    matchLabels:
      app: training-kong
  template:
    metadata:
      labels:
        app: training-kong
    spec:
      containers:
        - name: training-kong
          image: kong:3.6
          ports:
            - containerPort: 8000
            - containerPort: 8001
          env:
            - name: KONG_DATABASE
              value: "off"
            - name: KONG_DECLARATIVE_CONFIG
              value: "/etc/kong/kong.yml"
            - name: KONG_PROXY_ACCESS_LOG
              value: "/dev/stdout"
            - name: KONG_ADMIN_ACCESS_LOG
              value: "/dev/stdout"
            - name: KONG_PROXY_ERROR_LOG
              value: "/dev/stderr"
            - name: KONG_ADMIN_ERROR_LOG
              value: "/dev/stderr"
          volumeMounts:
            - name: kong-config
              mountPath: /etc/kong/kong.yml
              subPath: kong.yml
              readOnly: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "768Mi"
              cpu: "500m"
          startupProbe:
            exec:
              command:
                - kong
                - health
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            exec:
              command:
                - kong
                - health
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - kong
                - health
            periodSeconds: 5
            timeoutSeconds: 5
      volumes:
        - name: kong-config
          configMap:
            name: training-kong-config
