apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: training-platform
  labels:
    app: training-otel-collector
spec:
  selector:
    app: training-otel-collector
  ports:
    - name: otlp-grpc
      protocol: TCP
      port: 4317
      targetPort: 4317
    - name: otlp-http
      protocol: TCP
      port: 4318
      targetPort: 4318
    - name: metrics
      protocol: TCP
      port: 8888
      targetPort: 8888
  type: ClusterIP
