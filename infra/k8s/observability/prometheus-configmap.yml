apiVersion: v1
kind: ConfigMap
metadata:
  name: training-prometheus-config
  namespace: training-platform
data:
  prometheus-rules.yml: |
    groups:
      - name: training-alerts
        rules:
          - alert: ServiceDown
            expr: up == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Service {{ $labels.instance }} is down"
          - alert: HighErrorRate
            expr: rate(http_server_requests_seconds_count{status=~"5.."}[5m]) > 0.1
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "High error rate on {{ $labels.uri }}"
          - alert: HighLatency
            expr: histogram_quantile(0.95, rate(http_server_requests_seconds_bucket[5m])) > 2
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "High latency on {{ $labels.uri }}"
          - alert: HighHeapMemory
            expr: jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"} > 0.85
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High heap memory on {{ $labels.instance }}"
          - alert: CircuitBreakerOpen
            expr: resilience4j_circuitbreaker_state{state="open"} == 1
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Circuit breaker open on {{ $labels.name }}"
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files:
      - /etc/prometheus/prometheus-rules.yml
    scrape_configs:
      - job_name: 'otel-collector'
        static_configs:
          - targets: ['training-otel-collector:8888']
      - job_name: 'training-catalog-service'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['training-catalog-service:8081']
      - job_name: 'training-enrollment-service'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['training-enrollment-service:8082']
      - job_name: 'training-certification-service'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['training-certification-service:8083']
      - job_name: 'training-notification-service'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['training-notification-service:8084']
