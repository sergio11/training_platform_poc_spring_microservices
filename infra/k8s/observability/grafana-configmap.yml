apiVersion: v1
kind: ConfigMap
metadata:
  name: training-grafana-config
  namespace: training-platform
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: true
      - name: Jaeger
        type: jaeger
        access: proxy
        url: http://jaeger:16686
        editable: true
      - name: Loki
        type: loki
        access: proxy
        url: http://loki:3100
        editable: true
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: 'Training Platform'
        type: file
        disableDeletion: false
        editable: true
        updateIntervalSeconds: 10
        options:
          path: /etc/grafana/provisioning/dashboards
          foldersFromFilesStructure: false
  training-dashboard.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "panels": [
        {
          "id": 1,
          "title": "JVM Memory Used",
          "type": "timeseries",
          "targets": [
            {
              "expr": "jvm_memory_used_bytes{area=\"heap\"}",
              "legendFormat": "{{instance}}"
            }
          ],
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 }
        },
        {
          "id": 2,
          "title": "HTTP Requests Total",
          "type": "timeseries",
          "targets": [
            {
              "expr": "http_server_requests_seconds_count",
              "legendFormat": "{{method}} {{uri}}"
            }
          ],
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 }
        },
        {
          "id": 3,
          "title": "HTTP Request Duration",
          "type": "timeseries",
          "targets": [
            {
              "expr": "http_server_requests_seconds_sum / http_server_requests_seconds_count",
              "legendFormat": "{{method}} {{uri}}"
            }
          ],
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 }
        },
        {
          "id": 4,
          "title": "JVM Threads Live",
          "type": "timeseries",
          "targets": [
            {
              "expr": "jvm_threads_live_threads",
              "legendFormat": "{{instance}}"
            }
          ],
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 }
        }
      ],
      "schemaVersion": 39,
      "tags": ["training"],
      "templating": { "list": [] },
      "time": { "from": "now-1h", "to": "now" },
      "title": "Training Platform Dashboard",
      "uid": "training-main",
      "version": 1
    }
