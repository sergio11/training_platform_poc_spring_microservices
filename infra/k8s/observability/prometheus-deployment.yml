apiVersion: apps/v1
kind: Deployment
metadata:
  name: training-prometheus
  namespace: training-platform
  labels:
    app: training-prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: training-prometheus
  template:
    metadata:
      labels:
        app: training-prometheus
    spec:
      containers:
        - name: training-prometheus
          image: prom/prometheus:v2.50.0
          ports:
            - containerPort: 9090
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.retention.time=15d
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
              readOnly: true
            - name: prometheus-data
              mountPath: /prometheus
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: prometheus-config
          configMap:
            name: training-prometheus-config
        - name: prometheus-data
          emptyDir: {}
