apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: training-platform
  labels:
    app: training-jaeger
spec:
  selector:
    app: training-jaeger
  ports:
    - name: ui
      protocol: TCP
      port: 16686
      targetPort: 16686
    - name: collector
      protocol: TCP
      port: 14268
      targetPort: 14268
    - name: otlp-grpc
      protocol: TCP
      port: 4317
      targetPort: 4317
    - name: otlp-http
      protocol: TCP
      port: 4318
      targetPort: 4318
  type: ClusterIP
