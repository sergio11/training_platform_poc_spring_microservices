apiVersion: apps/v1
kind: Deployment
metadata:
  name: certification-service
  namespace: training-platform
  labels:
    app: certification-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: certification-service
  template:
    metadata:
      labels:
        app: certification-service
    spec:
      containers:
        - name: certification-service
          image: certification-service:latest
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: certification-service-config
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 20
            periodSeconds: 5
