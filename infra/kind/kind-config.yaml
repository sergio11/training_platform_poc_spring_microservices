# kind cluster configuration for local QA (kind + Podman provider).
# Creates the deterministic local cloud-native environment used by `rake k8s:cluster:create`.
# Kong's NodePort 30080 is mapped to localhost:8000 so the gateway is reachable
# exactly as documented (http://localhost:8000) without kubectl port-forward.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: poc-qa
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8000
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 30081
        hostPort: 8001
        listenAddress: "127.0.0.1"
        protocol: TCP
