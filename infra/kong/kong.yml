_format_version: "3.0"

services:
  - name: training-catalog-service
    url: http://training-catalog-service:8081
    routes:
      - name: catalog-routes
        paths:
          - /api/v1/courses
        strip_path: false
    plugins:
      - name: jwt
        config:
          uri_param_names: []
          header_names:
            - Authorization
      - name: rate-limiting
        config:
          minute: 100
          policy: local

  - name: enrollment-service
    url: http://training-enrollment-service:8082
    routes:
      - name: enrollment-routes
        paths:
          - /api/v1/enrollments
        strip_path: false
    plugins:
      - name: jwt
        config:
          uri_param_names: []
          header_names:
            - Authorization
      - name: rate-limiting
        config:
          minute: 100
          policy: local

  - name: certification-service
    url: http://training-certification-service:8083
    routes:
      - name: certification-routes
        paths:
          - /api/v1/certificates
        strip_path: false
    plugins:
      - name: jwt
        config:
          uri_param_names: []
          header_names:
            - Authorization
      - name: rate-limiting
        config:
          minute: 100
          policy: local

  - name: notification-service
    url: http://training-notification-service:8084
    routes:
      - name: notification-routes
        paths:
          - /api/v1/notifications
        strip_path: false
    plugins:
      - name: jwt
        config:
          uri_param_names: []
          header_names:
            - Authorization
      - name: rate-limiting
        config:
          minute: 100
          policy: local
